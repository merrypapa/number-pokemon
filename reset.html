<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>넘버 몬스터 어드벤처 · 새 버전으로 바꾸기</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #e8f4ff; color: #20232e; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 22px; padding: 26px 24px; max-width: 480px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.12); text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 1.6; margin: 8px 0; }
  .big { font-size: 40px; margin: 6px 0; }
  a.btn { display: inline-block; margin-top: 14px; padding: 12px 22px; border-radius: 999px; background: #ffd93d; color: #20232e; font-weight: 900; text-decoration: none; font-size: 17px; }
  small { color: #777; }
</style>
</head>
<body>
<div class="card">
  <div class="big">🔄</div>
  <h1>새 버전으로 바꾸는 중…</h1>
  <p id="msg">옛 파일을 지우고 있어요. 잠깐만 기다려 주세요.</p>
  <p><small>클라우드 계정(이름 + 비밀번호)으로 놀던 진행은 그대로예요. 이 기기에만 저장한 진행도 지워지지 않아요.</small></p>
  <a class="btn" id="go" href="./" hidden>▶ 게임 열기</a>
</div>
<script>
  // 옛 서비스 워커와 캐시를 모두 지운 뒤 게임을 새로 연다. (저장 데이터(localStorage·클라우드)는 건드리지 않는다)
  (async () => {
    const msg = document.getElementById('msg'), go = document.getElementById('go');
    try {
      if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
      msg.textContent = '다 지웠어요! 아래 버튼을 누르면 새 버전으로 열려요.';
    } catch (e) {
      msg.textContent = '지우다가 문제가 생겼어요: ' + (e && e.message ? e.message : e) + ' — 그래도 아래 버튼을 눌러 보세요.';
    }
    go.hidden = false;
    setTimeout(() => { location.replace('./?v=' + Date.now()); }, 1500);
  })();
</script>
</body>
</html>
