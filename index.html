<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>넘버 몬스터 어드벤처 — 프로토타입</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%272%27 y=%272%27 width=%2728%27 height=%2728%27 rx=%276%27 fill=%27%23ffd93d%27 stroke=%27%23333%27 stroke-width=%273%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27%23333%27%3E1%3C/text%3E%3C/svg%3E" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-row"><span class="hud-icon block"></span><span id="hud-blocks">블록 0개</span></div>
    <div class="hud-row"><span class="hud-icon mon"></span><span id="hud-caught">친구 0/3</span></div>
    <div class="hud-row"><span class="hud-icon nb"></span><span id="hud-rescued">구출 0/2</span></div>
    <div class="hud-row"><span class="hud-icon boss"></span><span id="hud-boss">보스 0/1</span></div>
  </div>

  <button id="btn-dex">📖 도감</button>
  <div id="dex" class="hidden">
    <div id="dex-card">
      <div id="dex-head">
        <div id="dex-title">몬스터 도감</div>
        <div id="dex-count"></div>
        <button id="btn-dex-close">닫기 ✕</button>
      </div>
      <div id="dex-grid"></div>
    </div>
  </div>

  <div id="msg" class="hidden">
    <div id="msg-face">1</div>
    <div id="msg-text"></div>
  </div>

  <canvas id="fx"></canvas>
  <div id="fade"></div>
  <div id="battle-banner" class="hidden"></div>
  <div id="battle-float" class="hidden"></div>

  <div id="battle" class="hidden">
    <div id="battle-top">
      <div id="battle-name"></div>
      <div id="battle-hp"></div>
      <div id="battle-hpnum"></div>
    </div>
    <div id="battle-msg"></div>
    <div id="battle-controls">
      <div id="battle-mine"></div>
      <div id="battle-picker">
        <button id="btn-n-minus">−</button>
        <div id="battle-n">1</div>
        <button id="btn-n-plus">+</button>
      </div>
      <button id="btn-throw">블록 1개 던지기!</button>
      <button id="btn-ball" class="hidden">숫자볼 던지기!</button>
      <button id="btn-run">나중에</button>
    </div>
    <div id="battle-help">↑↓ 개수 · 엔터/스페이스 던지기 · ESC 나중에</div>
  </div>

  <div id="touch" class="hidden">
    <div id="joy-zone">
      <div id="joy-base"><div id="joy-knob"></div></div>
    </div>
    <div id="touch-actions">
      <button data-key="action">액션</button>
      <button data-key="jump">점프</button>
    </div>
  </div>

  <div id="title">
    <div id="title-card">
      <h1>넘버 몬스터 어드벤처</h1>
      <p>챕터 1 · 숫자 초원 (프로토타입)</p>
      <button id="btn-start">시작하기</button>
      <div id="title-help">방향키/WASD 이동 · 스페이스 점프 · E 액션 · 화면 드래그/Q·R 카메라 회전 · B 도감</div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
